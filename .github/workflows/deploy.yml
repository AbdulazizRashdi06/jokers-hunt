name: Deploy to Zarqa

on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: Build on Zarqa without replacing the live app
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: jokers-hunt-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Send the release to Zarqa
        env:
          ZARQA_DEPLOY_KEY: ${{ secrets.ZARQA_DEPLOY_KEY }}
          ZARQA_KNOWN_HOSTS: ${{ secrets.ZARQA_KNOWN_HOSTS }}
          VERIFY_ONLY: ${{ inputs.verify_only }}
        run: |
          set -euo pipefail
          test -n "$ZARQA_DEPLOY_KEY"
          test -n "$ZARQA_KNOWN_HOSTS"
          deploy_dir="$(mktemp -d)"
          trap 'rm -rf "$deploy_dir"' EXIT
          chmod 700 "$deploy_dir"
          umask 077
          printf '%s\n' "$ZARQA_DEPLOY_KEY" > "$deploy_dir/key"
          printf '%s\n' "$ZARQA_KNOWN_HOSTS" > "$deploy_dir/known_hosts"
          git archive --format=tar.gz "$GITHUB_SHA" package.json package-lock.json \
            next.config.mjs next-env.d.ts tsconfig.json tailwind.config.ts postcss.config.mjs \
            src public scripts > "$deploy_dir/release.tar.gz"
          command="$GITHUB_SHA"
          if [[ "$VERIFY_ONLY" == 'true' ]]; then command="verify $GITHUB_SHA"; fi
          ssh -T -i "$deploy_dir/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$deploy_dir/known_hosts" \
            -o ConnectTimeout=20 deploy@173.249.40.122 "$command" < "$deploy_dir/release.tar.gz"
      - name: Verify public HTTPS
        run: |
          curl --fail --silent --show-error --retry 4 --retry-all-errors --max-time 12 \
            --output /dev/null https://jokers-hunt.173-249-40-122.sslip.io/
          curl --fail --silent --show-error --retry 4 --retry-all-errors --max-time 12 \
            https://jokers-hunt.173-249-40-122.sslip.io/api/config
